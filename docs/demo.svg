<text x="46" y="23.5" class="ui" fill="#948d87">michi<tspan fill="#6f6a66"> — a local-first ML workbench</tspan></text>

<g class="s0"><clipPath id="c0"><rect class="t0" x="39.6" y="52.0" width="0" height="20"/></clipPath><text x="24.0" y="66.0" class="mono" fill="#b23a30" font-weight="700">❯</text><g clip-path="url(#c0)"><text x="39.6" y="66.0" class="mono" fill="#ece9e4">michi inspect data/customers.csv --target purchased</text></g><text x="24.0" y="84.5" class="mono o0" fill="#ece9e4"><tspan fill="#b23a30" font-weight="700"> 道  michi inspect  ·  customers.csv</tspan></text><text x="24.0" y="121.5" class="mono o0" fill="#ece9e4">  600 rows × 14 columns  ·  14.5% of cells missing  ·  0 duplicate rows  ·</text><text x="24.0" y="140.0" class="mono o0" fill="#ece9e4">  target purchased</text><text x="24.0" y="158.5" class="mono o0" fill="#ece9e4">  sha256 0dbfe06c8719  ·  42.0 KB</text><text x="24.0" y="214.0" class="mono o0" fill="#ece9e4"><tspan fill="#ece9e4" font-weight="700">  Findings (14)</tspan></text><text x="24.0" y="251.0" class="mono o0" fill="#ece9e4">  <tspan fill="#e2645a" font-weight="600">high</tspan>    country                only one distinct value (JP)</text><text x="24.0" y="269.5" class="mono o0" fill="#ece9e4">  <tspan fill="#e2645a" font-weight="600">high</tspan>    country_copy           only one distinct value (JP)</text><text x="24.0" y="288.0" class="mono o0" fill="#ece9e4">  <tspan fill="#e2645a" font-weight="600">high</tspan>    notes                  every value is missing</text><text x="24.0" y="306.5" class="mono o0" fill="#ece9e4">  <tspan fill="#e2645a" font-weight="600">high</tspan>    cabin                  89.0% missing (534 of 600)</text><text x="24.0" y="325.0" class="mono o0" fill="#ece9e4">  <tspan fill="#e2645a" font-weight="600">high</tspan>    outcome_code           each of its 2 values maps to exactly one</text><text x="24.0" y="343.5" class="mono o0" fill="#ece9e4">                                 &#x27;purchased&#x27; class</text><text x="24.0" y="362.0" class="mono o0" fill="#ece9e4">  <tspan fill="#d4a548" font-weight="600">warn</tspan>    signup_date            values parse as dates but are stored as text</text><text x="24.0" y="380.5" class="mono o0" fill="#ece9e4">  <tspan fill="#d4a548" font-weight="600">warn</tspan>    country, country_copy  identical values in country, country_copy</text><text x="24.0" y="399.0" class="mono o0" fill="#ece9e4">  <tspan fill="#d4a548" font-weight="600">warn</tspan>    cabin                  66 distinct values across 66 rows</text><text x="24.0" y="417.5" class="mono o0" fill="#ece9e4">  <tspan fill="#d4a548" font-weight="600">warn</tspan>    fare                   skew 6.87 (right-tailed)</text><text x="24.0" y="452.6" class="mono n0" fill="#b23a30" font-weight="600">outcome_code predicts the label perfectly — a leak, not a feature</text></g>
<g class="s1"><clipPath id="c1"><rect class="t1" x="39.6" y="52.0" width="0" height="20"/></clipPath><text x="24.0" y="66.0" class="mono" fill="#b23a30" font-weight="700">❯</text><g clip-path="url(#c1)"><text x="39.6" y="66.0" class="mono" fill="#ece9e4">michi clean data/customers.csv --target purchased   # writes a recipe you own</text></g><text x="24.0" y="84.5" class="mono o1" fill="#ece9e4"><tspan fill="#6f6a66">  wrote recipe.yaml  ·  5 step(s)</tspan></text><text x="24.0" y="103.0" class="mono o1" fill="#ece9e4">    <tspan fill="#6f6a66" font-weight="700">·</tspan> drop  notes, country, country_copy, record_id, outcome_code +1</text><text x="24.0" y="121.5" class="mono o1" fill="#ece9e4">    <tspan fill="#6f6a66" font-weight="700">·</tspan> cast  amount_text</text><text x="24.0" y="140.0" class="mono o1" fill="#ece9e4">    <tspan fill="#6f6a66" font-weight="700">·</tspan> cast  signup_date</text><text x="24.0" y="158.5" class="mono o1" fill="#ece9e4">    <tspan fill="#6f6a66" font-weight="700">·</tspan> impute  salary</text><text x="24.0" y="177.0" class="mono o1" fill="#ece9e4">    <tspan fill="#6f6a66" font-weight="700">·</tspan> clip  fare</text><text x="24.0" y="232.5" class="mono o1" fill="#ece9e4">  To reproduce this without the prompts:</text><text x="24.0" y="251.0" class="mono o1" fill="#ece9e4">    michi clean data/customers.csv --drop</text><text x="24.0" y="269.5" class="mono o1" fill="#ece9e4">    notes,country,country_copy,record_id,outcome_code,age_months --cast amount_text=numeric</text><text x="24.0" y="288.0" class="mono o1" fill="#ece9e4">    --cast signup_date=datetime --impute salary=median --clip fare --target purchased</text><text x="24.0" y="325.0" class="mono o1" fill="#ece9e4">  Next:  michi apply recipe.yaml data/customers.csv -o clean.parquet</text><text x="24.0" y="343.5" class="mono o1" fill="#ece9e4">         michi export recipe.yaml -o pipeline.py</text></g>
<g class="s2"><clipPath id="c2"><rect class="t2" x="39.6" y="52.0" width="0" height="20"/></clipPath><text x="24.0" y="66.0" class="mono" fill="#b23a30" font-weight="700">❯</text><g clip-path="url(#c2)"><text x="39.6" y="66.0" class="mono" fill="#ece9e4">michi bench data/customers.csv --recipe michi.recipe.yaml --models linear,rf,hist-gbm</text></g><text x="24.0" y="103.0" class="mono o2" fill="#ece9e4">  classification  ·  600 rows  ·  5-fold cross-validation  ·  target purchased</text><text x="24.0" y="121.5" class="mono o2" fill="#ece9e4">  preparation: numeric: impute median · categorical: impute most_frequent +</text><text x="24.0" y="140.0" class="mono o2" fill="#ece9e4">  onehot · standardise (scale-sensitive models only) — fitted inside each fold</text><text x="24.0" y="158.5" class="mono o2" fill="#ece9e4">  seed 0  ·  3.9s</text><text x="24.0" y="195.5" class="mono o2" fill="#ece9e4"><tspan fill="#ece9e4" font-weight="700">  Results  (ranked by balanced_accuracy)</tspan></text><text x="24.0" y="232.5" class="mono o2" fill="#ece9e4">  model      balanced_accuracy      95% interval   vs <tspan fill="#6aab6e" font-weight="600">leader</tspan>                 fit</text><text x="24.0" y="251.0" class="mono o2" fill="#ece9e4"><tspan fill="#4a4553">  ──────────────────────────────────────────────────────────────────────────────</tspan></text><text x="24.0" y="269.5" class="mono o2" fill="#ece9e4">  linear                 0.892   0.8599 – 0.9241   <tspan fill="#6aab6e" font-weight="600">leader</tspan>                   0.4s</text><text x="24.0" y="288.0" class="mono o2" fill="#ece9e4">  rf                     0.878   0.8323 – 0.9235   <tspan fill="#d4a548">tied with leader</tspan>         0.9s</text><text x="24.0" y="306.5" class="mono o2" fill="#ece9e4">                                                   (p=0.589)</text><text x="24.0" y="325.0" class="mono o2" fill="#ece9e4">  hist-gbm               0.875     0.83 – 0.9192   <tspan fill="#d4a548">tied with leader</tspan>         1.9s</text><text x="24.0" y="343.5" class="mono o2" fill="#ece9e4">                                                   (p=0.589)</text><text x="24.0" y="362.0" class="mono o2" fill="#ece9e4">  dummy                    0.5         0.5 – 0.5   worse (p&lt;0.0001)         0.0s</text><text x="24.0" y="399.0" class="mono o2" fill="#ece9e4">  <tspan fill="#ece9e4" font-weight="700">Verdict</tspan>  linear scores highest, but rf, hist-gbm are statistically</text><text x="24.0" y="417.5" class="mono o2" fill="#ece9e4">  indistinguishable from it at this sample size. Choosing between them on these</text><text x="24.0" y="436.0" class="mono o2" fill="#ece9e4">  numbers alone is not supported.</text><text x="24.0" y="489.6" class="mono n2" fill="#b23a30" font-weight="600">most tools would have declared a winner here</text></g>
<g class="s3"><clipPath id="c3"><rect class="t3" x="39.6" y="52.0" width="0" height="20"/></clipPath><text x="24.0" y="66.0" class="mono" fill="#b23a30" font-weight="700">❯</text><g clip-path="url(#c3)"><text x="39.6" y="66.0" class="mono" fill="#ece9e4">michi export michi.recipe.yaml -o pipeline.py</text></g><text x="24.0" y="84.5" class="mono o3" fill="#ece9e4"><tspan fill="#6f6a66">  wrote pipeline.py</tspan></text><text x="24.0" y="103.0" class="mono o3" fill="#ece9e4">  it imports pandas and scikit-learn only — michi is not a dependency of this file</text><text x="24.0" y="158.5" class="mono o3" fill="#ece9e4">  ── pipeline.py ──────────────────────────────────────────────────────────────</text><text x="24.0" y="177.0" class="mono o3" fill="#ece9e4">  def prepare(frame: pd.DataFrame) -&gt; pd.DataFrame:</text><text x="24.0" y="195.5" class="mono o3" fill="#ece9e4">      &quot;&quot;&quot;Apply the deterministic cleaning steps.</text><text x="24.0" y="232.5" class="mono o3" fill="#ece9e4">      Returns a new frame; the input is never modified.</text><text x="24.0" y="251.0" class="mono o3" fill="#ece9e4">      &quot;&quot;&quot;</text><text x="24.0" y="288.0" class="mono o3" fill="#ece9e4">  def build_pipeline() -&gt; ColumnTransformer:</text><text x="24.0" y="306.5" class="mono o3" fill="#ece9e4">      &quot;&quot;&quot;Build the transformer for steps that learn from data.</text><text x="24.0" y="343.5" class="mono o3" fill="#ece9e4">      Fit this inside your cross-validation, never on the whole dataset:</text><text x="24.0" y="362.0" class="mono o3" fill="#ece9e4">      an imputer fitted on all rows has already seen your test fold.</text><text x="24.0" y="380.5" class="mono o3" fill="#ece9e4">      &quot;&quot;&quot;</text></g>
<g class="s4"><clipPath id="c4"><rect class="t4" x="39.6" y="52.0" width="0" height="20"/></clipPath><text x="24.0" y="66.0" class="mono" fill="#b23a30" font-weight="700">❯</text><g clip-path="url(#c4)"><text x="39.6" y="66.0" class="mono" fill="#ece9e4">michi        # no arguments opens the console</text></g><text x="24.0" y="84.5" class="mono o4" fill="#ece9e4"><tspan fill="#b23a30" font-weight="700">  ███╗   ███╗██╗ ██████╗██╗  ██╗██╗</tspan></text><text x="24.0" y="103.0" class="mono o4" fill="#ece9e4"><tspan fill="#b23a30" font-weight="700">  ████╗ ████║██║██╔════╝██║  ██║██║</tspan></text><text x="24.0" y="121.5" class="mono o4" fill="#ece9e4"><tspan fill="#b23a30" font-weight="700">  ██╔████╔██║██║██║     ███████║██║      道</tspan></text><text x="24.0" y="140.0" class="mono o4" fill="#ece9e4"><tspan fill="#b23a30" font-weight="700">  ██║╚██╔╝██║██║██║     ██╔══██║██║</tspan></text><text x="24.0" y="158.5" class="mono o4" fill="#ece9e4"><tspan fill="#b23a30" font-weight="700">  ██║ ╚═╝ ██║██║╚██████╗██║  ██║██║</tspan></text><text x="24.0" y="177.0" class="mono o4" fill="#ece9e4"><tspan fill="#b23a30" font-weight="700">  ╚═╝     ╚═╝╚═╝ ╚═════╝╚═╝  ╚═╝╚═╝</tspan></text><text x="24.0" y="214.0" class="mono o4" fill="#ece9e4"><tspan fill="#6f6a66">        =[</tspan><tspan fill="#948d87"> michi v1.2.0  ·  a local-first ML workbench                        </tspan><tspan fill="#6f6a66">]</tspan></text><text x="24.0" y="232.5" class="mono o4" fill="#ece9e4"><tspan fill="#6f6a66">+ -- --=[</tspan><tspan fill="#948d87"> 9 verbs  ·  14 models  ·  12 recipe ops  ·  26 explanations        </tspan><tspan fill="#6f6a66">]</tspan></text><text x="24.0" y="251.0" class="mono o4" fill="#ece9e4"><tspan fill="#6f6a66">+ -- --=[</tspan><tspan fill="#948d87"> 19 console commands  ·  no account, no telemetry, no network call  </tspan><tspan fill="#6f6a66">]</tspan></text><text x="24.0" y="288.0" class="mono o4" fill="#ece9e4"><tspan fill="#b23a30" font-weight="700">  心得  michi lists the options; you choose.</tspan></text><text x="24.0" y="306.5" class="mono o4" fill="#ece9e4">  path walks the stages · help lists commands · use &lt;file&gt; loads data</text><text x="24.0" y="343.5" class="mono o4" fill="#ece9e4"><tspan fill="#6f6a66">  tip: `clean` never modifies your data. It writes a recipe; `apply` produces a</tspan></text><text x="24.0" y="362.0" class="mono o4" fill="#ece9e4">       new file, always at a path you name.</text><text x="24.0" y="399.0" class="mono o4" fill="#ece9e4"><tspan fill="#948d87">michi </tspan><tspan fill="#b23a30" font-weight="700">›</tspan> <tspan fill="#ece9e4">use data/customers.csv</tspan></text><text x="24.0" y="417.5" class="mono o4" fill="#ece9e4"><tspan fill="#6f6a66">loaded customers.csv — 14 columns</tspan></text><text x="24.0" y="436.0" class="mono o4" fill="#ece9e4"><tspan fill="#948d87">michi (customers.csv) </tspan><tspan fill="#b23a30" font-weight="700">›</tspan> <tspan fill="#ece9e4">set target purchased</tspan></text><text x="24.0" y="454.5" class="mono o4" fill="#ece9e4"><tspan fill="#6f6a66">target = purchased</tspan></text><text x="24.0" y="473.0" class="mono o4" fill="#ece9e4"><tspan fill="#948d87">michi (customers.csv → purchased) </tspan><tspan fill="#b23a30" font-weight="700">›</tspan> <tspan fill="#ece9e4">path</tspan></text><text x="24.0" y="508.1" class="mono n4" fill="#b23a30" font-weight="600">Tab completes your own column names — the one thing a one-shot CLI cannot do</text></g>
<g class="s5"><clipPath id="c5"><rect class="t5" x="39.6" y="52.0" width="0" height="20"/></clipPath><text x="24.0" y="66.0" class="mono" fill="#b23a30" font-weight="700">❯</text><g clip-path="url(#c5)"><text x="39.6" y="66.0" class="mono" fill="#ece9e4">path        # the stages, and what this context can run</text></g><text x="24.0" y="103.0" class="mono o5" fill="#ece9e4">  <tspan fill="#6aab6e" font-weight="700">✓</tspan>   見   miru — see what you have             inspect   inspect --explain</text><text x="24.0" y="121.5" class="mono o5" fill="#ece9e4">  <tspan fill="#6aab6e" font-weight="700">✓</tspan>   整   totonoeru — decide what to fix       clean     clean --target &lt;col&gt;</text><text x="24.0" y="140.0" class="mono o5" fill="#ece9e4">  <tspan fill="#6aab6e" font-weight="700">✓</tspan>   直   naosu — produce the fixed data       apply     apply -o clean.parquet</text><text x="24.0" y="158.5" class="mono o5" fill="#ece9e4">  <tspan fill="#6aab6e" font-weight="700">✓</tspan>   比   kuraberu — compare models honestly   bench     bench --models …</text><text x="24.0" y="177.0" class="mono o5" fill="#ece9e4">  <tspan fill="#6aab6e" font-weight="700">✓</tspan>   確   tashikameru — verify one model       eval      eval &lt;model.pkl&gt;</text><text x="24.0" y="195.5" class="mono o5" fill="#ece9e4">  <tspan fill="#6aab6e" font-weight="700">✓</tspan>   探   sagasu — search a grid               sweep     sweep sweep.yaml</text><text x="24.0" y="214.0" class="mono o5" fill="#ece9e4">  <tspan fill="#6f6a66" font-weight="700">·</tspan>   記   shirusu — write up what happened     report    report runs/</text><text x="24.0" y="232.5" class="mono o5" fill="#ece9e4">  <tspan fill="#6aab6e" font-weight="700">✓</tspan>   出   dasu — take the code and go          export    export -o pipeline.py</text><text x="24.0" y="251.0" class="mono o5" fill="#ece9e4"><tspan fill="#6f6a66">  ✓ marks a stage this context can run right now. Every stage stands alone —</tspan></text><text x="24.0" y="269.5" class="mono o5" fill="#ece9e4"><tspan fill="#6f6a66">  run one and stop, or none of them. michi walks none of it for you.</tspan></text><text x="24.0" y="323.1" class="mono n5" fill="#b23a30" font-weight="600">a map, not a driver — `walk` asks its way through, one stage at a time</text></g>
</svg>
