site_name: Michi (道)
site_description: A local-first ML workbench — automate implementation, never judgement.
repo_url: https://github.com/cattolatte/michi

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Commands:
      - inspect: inspect.md
  - Philosophy: philosophy.md
  - Roadmap: roadmap.md
