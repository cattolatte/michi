name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --extra dev --extra ui

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src/michi

      - name: Tests
        run: uv run pytest

  torch:
    # torch is large and platform-specific, so michi does not install it by
    # default and the matrix above does not carry it. Without this job the
    # `torch-mlp` training loop never executes anywhere in CI — its tests skip
    # silently, which looks identical to passing.
    name: torch / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra dev --extra torch

      - name: Tests
        run: uv run pytest tests/unit/bench/test_neural.py -q

  coverage:
    name: coverage / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra dev --extra ui

      # Reported, not enforced. See the note in pyproject.toml.
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing
