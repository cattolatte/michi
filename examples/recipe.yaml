# michi recipe — cleaning decisions you made, as a file you own.
#
# Apply it:   michi apply recipe.yaml data.csv -o clean.parquet
# Compile it: michi export recipe.yaml -o pipeline.py
#
# Steps run in order. Edit them freely: this file is read with a plain YAML
# parser, so a hand-written recipe works exactly like a generated one.
#
# Operations: drop · dedupe · cast · impute · clip · encode · scale

schema_version: "1.0"
michi_version: "1.0.1"
created_at: "2026-07-27T01:46:33Z"
target: purchased

# The data this recipe was written against. Applying it to
# something with different columns fails loudly, on purpose.
source:
  path: "data/customers.csv"
  sha256: "0dbfe06c871919adcf4718267926b556d2d3c9c03bd23f52e08383b26ac506f5"
  n_rows: 600
  columns:
    age: numeric
    salary: numeric
    region: categorical
    cabin: categorical
    notes: empty
    country: categorical
    country_copy: categorical
    record_id: text
    fare: numeric
    amount_text: text
    signup_date: categorical
    age_months: numeric
    outcome_code: categorical
    purchased: numeric

# Note: impute, encode, and scale learn from the data they see. `michi apply`
# fits them on whatever file you give it, which is fine for exploration. For
# modelling, use `michi export` — the generated pipeline fits them inside the
# train/test split, where they cannot leak.
steps:
  - op: drop
    columns: ["notes", "country", "country_copy", "record_id", "outcome_code", "age_months"]
    why: "requested with --drop"
  - op: cast
    columns: ["amount_text"]
    to: numeric
  - op: cast
    columns: ["signup_date"]
    to: datetime
  - op: impute
    columns: ["salary"]
    strategy: median
  - op: clip
    columns: ["fare"]
    lower_quantile: 0.01
    upper_quantile: 0.99
